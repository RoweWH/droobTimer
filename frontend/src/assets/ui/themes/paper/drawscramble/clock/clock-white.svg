<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="clock-face-clip">
      <circle cx="50" cy="50" r="47.6"/>
    </clipPath>
  </defs>

  <!-- Clock face -->
  <circle cx="50" cy="50" r="47.6" fill="#ecebe2"/>

  <!-- Hand-drawn horizontal texture matching the NxN and Pyraminx stickers -->
  <g
    clip-path="url(#clock-face-clip)"
    fill="none"
    stroke="#242424"
    stroke-width="0.72"
    stroke-linecap="round"
    opacity="0.42"
  >
    <path d="M20 12.5 C38 12.1 62 12.9 80 12.5"/>
    <path d="M13 18.5 C34 18.9 66 18.1 87 18.5"/>
    <path d="M9 24.5 C31 24.1 69 24.9 91 24.5"/>
    <path d="M6 30.5 C29 30.9 71 30.1 94 30.5"/>
    <path d="M4 36.5 C28 36.1 72 36.9 96 36.5"/>
    <path d="M3 42.5 C27 42.9 73 42.1 97 42.5"/>
    <path d="M2.5 48.5 C27 48.1 73 48.9 97.5 48.5"/>
    <path d="M2.8 54.5 C27 54.9 73 54.1 97.2 54.5"/>
    <path d="M4 60.5 C28 60.1 72 60.9 96 60.5"/>
    <path d="M6 66.5 C29 66.9 71 66.1 94 66.5"/>
    <path d="M9 72.5 C31 72.1 69 72.9 91 72.5"/>
    <path d="M13 78.5 C34 78.9 66 78.1 87 78.5"/>
    <path d="M20 84.5 C38 84.1 62 84.9 80 84.5"/>
  </g>

  <!-- Slightly imperfect double outline -->
  <circle
    cx="50"
    cy="50"
    r="47.6"
    fill="none"
    stroke="#242424"
    stroke-width="2.15"
  />
  <path
    d="M50.4 2.9
       C76.7 2.6 97.3 23.7 97 50.2
       C96.8 76.5 76 97.2 49.6 97
       C23.3 96.8 2.8 76.1 3 49.7
       C3.2 23.6 24 3.1 50.4 2.9 Z"
    fill="none"
    stroke="#242424"
    stroke-width="0.7"
    stroke-linecap="round"
    opacity="0.62"
  />

  <!-- Hand points to 12 o'clock; rotate the whole image around its center in React -->
  <path
    d="M50 50 C50.3 42.5 49.7 30.5 50.2 15"
    fill="none"
    stroke="#242424"
    stroke-width="4.8"
    stroke-linecap="round"
  />
  <circle cx="50" cy="50" r="4.5" fill="#242424"/>
</svg>
